<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyBi - Pengelola Keuangan Bulanan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">

        <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen font-sans transition-colors duration-200">

    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-3.5 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-white shadow-md shadow-emerald-500/20 font-bold text-xl">
                    M
                </div>
                <div>
                    <h1 class="font-bold text-xl leading-none bg-gradient-to-r from-emerald-600 to-teal-500 bg-clip-text text-transparent">MoneyBi</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">Pengelola Keuangan Bulanan</p>
                </div>
            </div>

            <button id="themeToggle" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">
                <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
                <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6 space-y-6">
        <section class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-gradient-to-br from-emerald-600 to-teal-600 text-white rounded-2xl p-5 shadow-lg shadow-emerald-600/10 relative overflow-hidden">
                <div class="flex justify-between items-start mb-2">
                    <span class="text-xs font-semibold uppercase tracking-wider text-emerald-100">Sisa Saldo</span>
                    <i data-lucide="wallet" class="w-5 h-5 text-emerald-200"></i>
                </div>
                <div class="text-2xl font-bold tracking-tight" id="totalBalance">Rp 0</div>
                <div class="mt-4 pt-3 border-t border-white/10 flex items-center justify-between text-xs text-emerald-100">
                    <span>Persentase Pengeluaran</span>
                    <span id="expenseRatio" class="font-semibold">0%</span>
                </div>
                <div class="w-full bg-black/20 h-1.5 rounded-full mt-1.5 overflow-hidden">
                    <div id="expenseProgressBar" class="bg-white h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>

            <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 border border-slate-200/80 dark:border-slate-700/80 shadow-sm">
                <div class="flex justify-between items-start mb-2">
                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Total Pemasukan</span>
                    <div class="p-2 rounded-lg bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400">
                        <i data-lucide="arrow-down-left" class="w-4 h-4"></i>
                    </div>
                </div>
                <div class="text-2xl font-bold text-slate-900 dark:text-white" id="totalIncome">Rp 0</div>
                <p class="text-xs text-slate-500 mt-2" id="incomeCount">0 Transaksi</p>
            </div>

            <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 border border-slate-200/80 dark:border-slate-700/80 shadow-sm">
                <div class="flex justify-between items-start mb-2">
                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Total Pengeluaran</span>
                    <div class="p-2 rounded-lg bg-rose-50 dark:bg-rose-950/40 text-rose-600 dark:text-rose-400">
                        <i data-lucide="arrow-up-right" class="w-4 h-4"></i>
                    </div>
                </div>
                <div class="text-2xl font-bold text-slate-900 dark:text-white" id="totalExpense">Rp 0</div>
                <p class="text-xs text-slate-500 mt-2" id="expenseCount">0 Transaksi</p>
            </div>
        </section>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <section class="lg:col-span-5 bg-white dark:bg-slate-800 rounded-2xl p-5 border border-slate-200/80 dark:border-slate-700/80 shadow-sm">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                    <i data-lucide="plus-circle" class="w-5 h-5 text-emerald-500"></i>
                    Tambah Transaksi
                </h2>

                <form id="transactionForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Jenis Transaksi</label>
                        <div class="grid grid-cols-2 gap-2">
                            <label class="cursor-pointer">
                                <input type="radio" name="type" value="expense" checked class="peer sr-only">
                                <div class="p-2.5 text-center text-sm font-medium rounded-xl border border-slate-200 dark:border-slate-700 peer-checked:bg-rose-50 dark:peer-checked:bg-rose-950/40 peer-checked:border-rose-500 peer-checked:text-rose-600 dark:peer-checked:text-rose-400 transition-all">
                                    Pengeluaran
                                </div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="type" value="income" class="peer sr-only">
                                <div class="p-2.5 text-center text-sm font-medium rounded-xl border border-slate-200 dark:border-slate-700 peer-checked:bg-emerald-50 dark:peer-checked:bg-emerald-950/40 peer-checked:border-emerald-500 peer-checked:text-emerald-600 dark:peer-checked:text-emerald-400 transition-all">
                                    Pemasukan
                                </div>
                            </label>
                        </div>
                    </div>

                    <div>
                        <label for="category" class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Kategori</label>
                        <select id="category" required class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        </select>
                    </div>

                    <div>
                        <label for="amount" class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Nominal (Rp)</label>
                        <input type="number" id="amount" placeholder="0" min="1" required class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>

                    <div>
                        <label for="date" class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Tanggal</label>
                        <input type="date" id="date" required class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>

                    <div>
                        <label for="note" class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Catatan / Keterangan</label>
                        <input type="text" id="note" placeholder="Contoh: Beli bensin, Nasi goreng" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>

                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl transition-colors shadow-lg shadow-emerald-600/20 text-sm flex items-center justify-center gap-2">
                        <i data-lucide="plus" class="w-4 h-4"></i> Simpan Transaksi
                    </button>
                </form>
            </section>

            <section class="lg:col-span-7 bg-white dark:bg-slate-800 rounded-2xl p-5 border border-slate-200/80 dark:border-slate-700/80 shadow-sm flex flex-col">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                    <i data-lucide="pie-chart" class="w-5 h-5 text-emerald-500"></i>
                    Analisis Pengeluaran
                </h2>
                <div class="flex-1 flex items-center justify-center min-h-[250px] relative">
                    <canvas id="expenseChart"></canvas>
                    <p id="emptyChartMessage" class="hidden text-slate-400 text-sm text-center">Belum ada data pengeluaran untuk ditampilkan pada grafik.</p>
                </div>
            </section>
        </div>

        <section class="bg-white dark:bg-slate-800 rounded-2xl p-5 border border-slate-200/80 dark:border-slate-700/80 shadow-sm space-y-4">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <h2 class="text-lg font-bold flex items-center gap-2">
                    <i data-lucide="history" class="w-5 h-5 text-emerald-500"></i>
                    Riwayat Transaksi
                </h2>
                <button id="exportCsvBtn" class="inline-flex items-center gap-2 px-3 py-1.5 text-xs font-semibold text-emerald-700 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/50 hover:bg-emerald-100 rounded-lg transition-colors border border-emerald-200 dark:border-emerald-800/50 self-start md:self-auto">
                    <i data-lucide="download" class="w-3.5 h-3.5"></i> Ekspor CSV
                </button>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2">
                <div>
                    <input type="text" id="searchInput" placeholder="Cari catatan..." class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <select id="filterType" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <option value="all">Semua Tipe</option>
                        <option value="income">Pemasukan</option>
                        <option value="expense">Pengeluaran</option>
                    </select>
                </div>
                <div>
                    <input type="month" id="filterMonth" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
            </div>

            <div class="overflow-x-auto">
                <div id="transactionList" class="space-y-2 min-w-[500px]">
                </div>
            </div>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
